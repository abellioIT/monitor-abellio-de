name: Sync to GitLab
run-name: ${{ github.actor }} is syncing to deployment repo!

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan gitlab.paar-it.de >> ~/.ssh/known_hosts
          
      - name: Configure git
        run: |
          git config --global user.email "runner@github.com"
          git config --global user.name "github runner abellio"

      - name: Add UponU Gitlab as remote
        run: |
          git remote add gitlab git@gitlab.paar-it.de:001269-abellio-gmbh/abellio-website/abellio-webseite-monitor.git

      - name: Prepare tree
        run: |
          git fetch gitlab master
          git checkout -B sync gitlab/master
          ## Dieses Kommando wird fehlschlagen, daher der logische Operator mit true, damit die Pipeline nicht abschmiert
          git merge origin/main --no-commit --no-ff || true
      - name: Fix conflicts
        run: |
          git rm -r --cached .github/workflows
          git commit -m "Sync"
          

      - name: Push to GitLab
        run: |
          git push gitlab sync:master
