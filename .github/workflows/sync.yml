name: Sync to GitLab
run-name: ${{ github.actor }} is syncing to deployment repo!

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan gitlab.paar-it.de >> ~/.ssh/known_hosts
          
      - name: Configure git
        run: |
          git config --global user.email "runner@github.com"
          git config --global user.name "github runner abellio"

      - name: Add UponU Gitlab as remote
        run: |
          git remote add gitlab git@gitlab.paar-it.de:001269-abellio-gmbh/abellio-website/abellio-webseite-monitor.git

      - name: Fetch and merge both branches
        run: |
          git fetch gitlab master
          git checkout main
          git merge gitlab/master --allow-unrelated-histories -m "Sync to UponU" || true

      - name: Resolve Conflicts between the two different ci-files
        run: |
          git rm -rf .github/workflows || true

          # Always take GitLab CI file from GitLab
          git checkout gitlab/master -- .gitlab-ci.yml || true
          git add .gitlab-ci.yml || true

      - name: Stage, Commit and Push
        run: |
          # Add local changes from GitHub repo (if any)
          git add -A

          # Check if there is anything to commit
          if git diff --cached --quiet HEAD --; then
            echo "No local changes to commit."
          else
            git commit -m "Sync from Github to Gitlab (last commit: ${{ github.event.head_commit.message || 'manual trigger' }})"
          fi

          # Push changes to GitLab only if the local branch is ahead
          LOCAL=$(git rev-parse main)
          REMOTE=$(git rev-parse gitlab/master || echo "")

          if [ "$LOCAL" != "$REMOTE" ]; then
            echo "Local main is ahead of GitLab. Pushing..."
            git push gitlab main:master
          else
            echo "GitLab is already up-to-date. Nothing to push."
          fi
